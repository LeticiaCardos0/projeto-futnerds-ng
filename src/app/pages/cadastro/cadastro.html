<div class="min-h-screen bg-[#030609] flex items-center justify-center px-4 py-10">

  <div
    class="w-full max-w-5xl rounded-3xl border border-green-500/20 bg-[#0a0b0f] p-6 md:p-10 shadow-[0_0_40px_rgba(34,197,94,0.08)]"
  >

    <div class="text-center mb-10">
      <h2 class="text-3xl md:text-4xl font-black uppercase tracking-tight text-white">
        Crie sua Conta no
        <span class="text-green-500">FUTNERDS</span>
      </h2>

      <p class="text-gray-500 mt-2">
        Siga os passos para configurar seu perfil de treinador
      </p>
    </div>
<p-stepper [(value)]="activeStep" class="bg-transparent">
  <!-- TIMELINE -->
  <p-step-list class="mb-10">

    <p-step [value]="1">
      <ng-template #content let-activateCallback="activateCallback">
        <button
          (click)="activateCallback(1)"
          class="flex flex-col items-center gap-3 cursor-pointer"
        >
          <div
            class="w-14 h-14 rounded-full bg-green-500 flex items-center justify-center shadow-[0_0_15px_rgba(34,197,94,0.4)]"
          >
            <i class="pi pi-user text-black text-lg"></i>
          </div>

          <span
            class="text-[11px] text-center font-bold uppercase text-white leading-tight"
          >
            Dados do<br />
            Treinador
          </span>
        </button>
      </ng-template>
    </p-step>

    <p-step [value]="2">
      <ng-template #content let-activateCallback="activateCallback">
        <button
          (click)="activateCallback(2)"
          class="flex flex-col items-center gap-3 cursor-pointer"
        >
          <div
            class="w-14 h-14 rounded-full bg-[#13151c] border border-white/20 flex items-center justify-center"
          >
            <i class="pi pi-star text-gray-400 text-lg"></i>
          </div>

          <span
            class="text-[11px] text-center font-bold uppercase text-gray-400 leading-tight"
          >
            Seus<br />
            Interesses
          </span>
        </button>
      </ng-template>
    </p-step>

    <p-step [value]="3">
      <ng-template #content let-activateCallback="activateCallback">
        <button
          (click)="activateCallback(3)"
          class="flex flex-col items-center gap-3 cursor-pointer"
        >
          <div
            class="w-14 h-14 rounded-full bg-[#13151c] border border-white/20 flex items-center justify-center"
          >
            <i class="pi pi-check text-gray-400 text-lg"></i>
          </div>

          <span
            class="text-[11px] text-center font-bold uppercase text-gray-400 leading-tight"
          >
            Contratado
          </span>
        </button>
      </ng-template>
    </p-step>

  </p-step-list>

  <!-- PAINÉIS -->
  <p-step-panels
    class="rounded-3xl border border-white/5 bg-[#13151c] p-6 md:p-8 shadow-inner"
  >

    <!-- PASSO 1 -->
    <p-step-panel [value]="1">
      <ng-template #content let-activateCallback="activateCallback">

        <div class="max-w-md mx-auto flex flex-col gap-5">

          <div class="text-center mb-2">
            <h3
              class="text-xl font-black text-white uppercase tracking-tighter"
            >
              Seus Dados
            </h3>
          </div>

          <div class="flex flex-col gap-1.5">
            <label
              class="text-[10px] font-black uppercase tracking-widest text-gray-500 ml-1"
            >
              Nome Completo
            </label>

            <input
              pInputText
              placeholder="Ex: Pep Guardiola"
              class="w-full !bg-[#1a1d26] !border-white/10 !text-white !rounded-xl !p-3.5"
            />
          </div>

          <div class="flex flex-col gap-1.5">
            <label
              class="text-[10px] font-black uppercase tracking-widest text-gray-500 ml-1"
            >
              E-mail Profissional
            </label>

            <input
              pInputText
              type="email"
              placeholder="treinador@futnerds.com"
              class="w-full !bg-[#1a1d26] !border-white/10 !text-white !rounded-xl !p-3.5"
            />
          </div>

          <div class="flex flex-col gap-1.5">
            <label
              class="text-[10px] font-black uppercase tracking-widest text-gray-500 ml-1"
            >
              Senha de Acesso
            </label>

            <p-password
              [toggleMask]="true"
              [feedback]="false"
              placeholder="••••••••"
              class="w-full"
              inputStyleClass="w-full !bg-[#1a1d26] !border-white/10 !text-white !rounded-xl !p-3.5"
            />
          </div>

          <div class="pt-4 flex justify-end">
            <button
              (click)="activateCallback(2)"
              class="inline-flex items-center gap-2 rounded-xl bg-green-500 px-8 py-3 font-black text-black hover:bg-green-400 text-xs uppercase tracking-widest"
            >
              PRÓXIMO PASSO
              <i class="pi pi-arrow-right"></i>
            </button>
          </div>

        </div>

      </ng-template>
    </p-step-panel>

    <!-- PASSO 2 -->
    <p-step-panel [value]="2">
      <ng-template #content let-activateCallback="activateCallback">

        <div class="max-w-lg mx-auto flex flex-col gap-6">

          <div class="text-center mb-2">
            <h3
              class="text-xl font-black text-white uppercase tracking-tighter"
            >
              Seus Interesses
            </h3>

            <p
              class="text-xs text-gray-500 mt-1 uppercase font-bold tracking-widest"
            >
              Configure sua identidade
            </p>
          </div>

          <div class="grid md:grid-cols-2 gap-4">

            <div class="flex flex-col gap-1.5">
              <label
                class="text-[10px] font-black uppercase tracking-widest text-gray-500 ml-1"
              >
                Seu Apelido (Nick)
              </label>

              <input
                pInputText
                placeholder="Ex: Coringa"
                class="w-full !bg-[#1a1d26] !border-white/10 !text-white !rounded-xl !p-3.5"
              />
            </div>

            <div class="flex flex-col gap-1.5">
              <label
                class="text-[10px] font-black uppercase tracking-widest text-gray-500 ml-1"
              >
                Time do Coração
              </label>

              <input
                pInputText
                placeholder="Ex: Corinthians"
                class="w-full !bg-[#1a1d26] !border-white/10 !text-white !rounded-xl !p-3.5"
              />
            </div>

          </div>

          <div class="flex justify-between pt-4">

            <button
              (click)="activateCallback(1)"
              class="text-gray-400 text-xs font-bold uppercase"
            >
              ← Voltar
            </button>

            <button
              (click)="activateCallback(3)"
              class="inline-flex items-center gap-2 rounded-xl bg-green-500 px-8 py-3 font-black text-black hover:bg-green-400 text-xs uppercase tracking-widest"
            >
              Finalizar
              <i class="pi pi-check"></i>
            </button>

          </div>

        </div>

      </ng-template>
    </p-step-panel>

    <!-- PASSO 3 -->
    <p-step-panel [value]="3">
      <ng-template #content>

        <div class="flex flex-col items-center gap-8 py-10">

          <div
            class="flex h-24 w-24 items-center justify-center rounded-full border-2 border-green-500/30 bg-green-500/10"
          >
            <i class="pi pi-check text-5xl text-green-500"></i>
          </div>

          <div class="text-center">

            <h3
              class="text-4xl font-black text-white uppercase tracking-tighter"
            >
              CONTRATADO!
            </h3>

            <p class="text-gray-500 mt-3">
              Seu perfil foi criado com sucesso. O vestiário já está à sua
              espera, treinador.
            </p>

          </div>

          <button
            routerLink="/"
            class="rounded-2xl bg-green-500 px-10 py-4 font-black text-black hover:bg-green-400 uppercase tracking-widest text-sm"
          >
            IR PARA O PAINEL
          </button>

        </div>

      </ng-template>
    </p-step-panel>

  </p-step-panels>

</p-stepper>
