<div class="min-h-screen bg-slate-950 flex items-center justify-center px-4 py-12">
  <div
    class="w-full max-w-2xl rounded-3xl border border-slate-800 bg-slate-900/80 backdrop-blur p-6 md:p-8 shadow-2xl"
  >
    <!-- Header -->
    <div class="text-center mb-10">
      <h2 class="text-2xl md:text-3xl font-extrabold text-white mb-2">
        Crie sua Conta no
        <span class="text-green-500">FUTNERDS</span>
      </h2>
      <p class="text-slate-400 text-sm md:text-base">
        Siga os passos para configurar seu perfil de treinador
      </p>
    </div>

    <p-stepper class="bg-transparent">
      <!-- Steps -->
      <p-step-list class="mb-8 grid grid-cols-3 gap-4">
        <!-- Perfil -->
        <p-step class="flex-auto">
          <ng-template #content let-activateCallback="activateCallback">
            <button
              class="w-full flex flex-col items-center gap-2 bg-transparent border-0 cursor-pointer group"
              (click)="activateCallback()"
            >
              <span
                class="flex h-12 w-12 md:h-14 md:w-14 items-center justify-center rounded-full border-2 border-green-500 bg-green-500 text-black shadow-lg shadow-green-500/30"
              >
                <i class="pi pi-user text-lg md:text-xl"></i>
              </span>

              <span
                class="text-[10px] font-bold uppercase tracking-widest text-green-500"
              >
                Perfil
              </span>
            </button>
          </ng-template>
        </p-step>

        <!-- Interesses -->
        <p-step class="flex-auto">
          <ng-template #content let-activateCallback="activateCallback">
            <button
              class="w-full flex flex-col items-center gap-2 bg-transparent border-0 cursor-pointer group"
              (click)="activateCallback()"
            >
              <span
                class="flex h-12 w-12 md:h-14 md:w-14 items-center justify-center rounded-full border-2 border-slate-700 text-slate-500 transition-all group-hover:border-slate-500"
              >
                <i class="pi pi-star text-lg md:text-xl"></i>
              </span>

              <span
                class="text-[10px] font-bold uppercase tracking-widest text-slate-500"
              >
                Interesses
              </span>
            </button>
          </ng-template>
        </p-step>

        <!-- Final -->
        <p-step class="flex-auto">
          <ng-template #content let-activateCallback="activateCallback">
            <button
              class="w-full flex flex-col items-center gap-2 bg-transparent border-0 cursor-pointer group"
              (click)="activateCallback()"
            >
              <span
                class="flex h-12 w-12 md:h-14 md:w-14 items-center justify-center rounded-full border-2 border-slate-700 text-slate-500 transition-all group-hover:border-slate-500"
              >
                <i class="pi pi-check text-lg md:text-xl"></i>
              </span>

              <span
                class="text-[10px] font-bold uppercase tracking-widest text-slate-500"
              >
                Final
              </span>
            </button>
          </ng-template>
        </p-step>
      </p-step-list>

      <!-- Panels -->
      <p-step-panels
        class="mt-6 rounded-2xl border border-slate-800 bg-slate-900/60 p-6 md:p-8"
      >
        <!-- PASSO 1 -->
        <p-step-panel>
          <ng-template #content let-activateCallback="activateCallback">
            <div class="max-w-md mx-auto flex flex-col gap-5">
              <div class="text-center">
                <h3 class="text-xl font-bold text-white">
                  Dados do Treinador
                </h3>
              </div>

              <div class="flex flex-col gap-2">
                <label
                  class="text-xs font-semibold uppercase tracking-wider text-slate-400"
                >
                  Nome Completo
                </label>

                <input
                  pInputText
                  placeholder="Ex: Pep Guardiola"
                  class="w-full !bg-slate-800 !border-slate-700 !text-white !rounded-xl !p-3.5 focus:!border-green-500 focus:!ring-1 focus:!ring-green-500 transition-all"
                />
              </div>

              <div class="flex flex-col gap-2">
                <label
                  class="text-xs font-semibold uppercase tracking-wider text-slate-400"
                >
                  E-mail Profissional
                </label>

                <input
                  pInputText
                  type="email"
                  placeholder="treinador@futnerds.com"
                  class="w-full !bg-slate-800 !border-slate-700 !text-white !rounded-xl !p-3.5 focus:!border-green-500 focus:!ring-1 focus:!ring-green-500 transition-all"
                />
              </div>

              <div class="flex flex-col gap-2">
                <label
                  class="text-xs font-semibold uppercase tracking-wider text-slate-400"
                >
                  Senha de Acesso
                </label>

                <p-password
                  [toggleMask]="true"
                  [feedback]="false"
                  placeholder="••••••••"
                  class="w-full"
                  inputStyleClass="w-full !bg-slate-800 !border-slate-700 !text-white !rounded-xl !p-3.5 focus:!border-green-500 focus:!ring-1 focus:!ring-green-500 transition-all"
                />
              </div>

              <div class="pt-4 flex justify-end">
                <button
                  (click)="activateCallback(2)"
                  class="inline-flex items-center gap-2 rounded-xl bg-green-500 px-6 py-3 font-bold text-black transition-all hover:bg-green-400 hover:scale-105 active:scale-95"
                >
                  PRÓXIMO PASSO
                  <i class="pi pi-arrow-right"></i>
                </button>
              </div>
            </div>
          </ng-template>
        </p-step-panel>

        <!-- PASSO 2 -->
        <p-step-panel>
          <ng-template #content let-activateCallback="activateCallback">
            <div class="max-w-lg mx-auto flex flex-col gap-6">
              <div class="text-center">
                <h3 class="text-xl font-bold text-white">
                  Áreas de Especialização
                </h3>

                <p class="text-sm text-slate-400 mt-1">
                  Selecione o que você mais foca em sua gestão
                </p>
              </div>

              <div class="flex flex-wrap justify-center gap-3">
                <p-togglebutton
                  onLabel="Táticas"
                  offLabel="Táticas"
                  styleClass="!bg-slate-800 !border-slate-700 !text-slate-300 !rounded-xl !px-4 !py-3 hover:!border-green-500 transition-all"
                />

                <p-togglebutton
                  onLabel="Mercado"
                  offLabel="Mercado"
                  styleClass="!bg-slate-800 !border-slate-700 !text-slate-300 !rounded-xl !px-4 !py-3 hover:!border-green-500 transition-all"
                />

                <p-togglebutton
                  onLabel="Estatísticas"
                  offLabel="Estatísticas"
                  styleClass="!bg-slate-800 !border-slate-700 !text-slate-300 !rounded-xl !px-4 !py-3 hover:!border-green-500 transition-all"
                />

                <p-togglebutton
                  onLabel="Base"
                  offLabel="Base"
                  styleClass="!bg-slate-800 !border-slate-700 !text-slate-300 !rounded-xl !px-4 !py-3 hover:!border-green-500 transition-all"
                />

                <p-togglebutton
                  onLabel="Finanças"
                  offLabel="Finanças"
                  styleClass="!bg-slate-800 !border-slate-700 !text-slate-300 !rounded-xl !px-4 !py-3 hover:!border-green-500 transition-all"
                />

                <p-togglebutton
                  onLabel="Treinos"
                  offLabel="Treinos"
                  styleClass="!bg-slate-800 !border-slate-700 !text-slate-300 !rounded-xl !px-4 !py-3 hover:!border-green-500 transition-all"
                />

                <p-togglebutton
                  onLabel="Olheiro"
                  offLabel="Olheiro"
                  styleClass="!bg-slate-800 !border-slate-700 !text-slate-300 !rounded-xl !px-4 !py-3 hover:!border-green-500 transition-all"
                />
              </div>

              <div class="flex items-center justify-between pt-4">
                <button
                  (click)="activateCallback(1)"
                  class="flex items-center gap-2 px-4 py-2 font-semibold text-slate-400 hover:text-white transition"
                >
                  <i class="pi pi-arrow-left"></i>
                  VOLTAR
                </button>

                <button
                  (click)="activateCallback(3)"
                  class="inline-flex items-center gap-2 rounded-xl bg-green-500 px-6 py-3 font-bold text-black transition-all hover:bg-green-400 hover:scale-105 active:scale-95"
                >
                  FINALIZAR
                  <i class="pi pi-check"></i>
                </button>
              </div>
            </div>
          </ng-template>
        </p-step-panel>

        <!-- PASSO 3 -->
        <p-step-panel>
          <ng-template #content let-activateCallback="activateCallback">
            <div class="flex flex-col items-center gap-8 py-10">
              <div class="relative">
                <div
                  class="flex h-24 w-24 items-center justify-center rounded-full border-2 border-green-500/30 bg-green-500/10"
                >
                  <i class="pi pi-check text-5xl text-green-500"></i>
                </div>

                <div
                  class="absolute -top-1 -right-1 h-6 w-6 rounded-full border-4 border-slate-900 bg-green-500"
                ></div>
              </div>

              <div class="text-center">
                <h3
                  class="text-2xl md:text-4xl font-extrabold text-white mb-3"
                >
                  CONTRATADO!
                </h3>

                <p class="max-w-xs mx-auto text-slate-400">
                  Seu perfil foi criado com sucesso. O vestiário já está à sua
                  espera.
                </p>
              </div>

              <button
                routerLink="/"
                class="rounded-2xl bg-green-500 px-8 py-4 font-bold text-black transition-all hover:bg-green-400 hover:scale-105 active:scale-95"
              >
                IR PARA O PAINEL
              </button>
            </div>
          </ng-template>
        </p-step-panel>
      </p-step-panels>
    </p-stepper>
  </div>
</div>
