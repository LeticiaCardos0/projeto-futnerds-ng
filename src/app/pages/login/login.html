<div class="min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md rounded-3xl border border-white/5 bg-[#0a0b0f] p-8 md:p-12 shadow-2xl">
    
        <!-- Header -->
        <div class="text-center mb-10">
          <h1 class="text-3xl md:text-4xl font-black uppercase tracking-tighter text-white mb-2">
            Login <span class="text-green-500">FUTNERDS</span>
          </h1>
          <p class="text-gray-500 text-sm font-medium">Inicie sua jornada com o FutNerds</p>
        </div>
    
        <!-- Form -->
        <form class="flex flex-col gap-5">
    
          <!-- E-mail -->
          <div class="flex flex-col gap-2">
            <label for="campo-email" class="text-[10px] font-bold uppercase tracking-widest text-gray-500 ml-1">
              Digite seu E-mail
            </label>
            <div class="relative group">
              <i class="pi pi-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-600 text-sm transition-colors group-focus-within:text-green-500"></i>
              <input
                type="email"
                id="campo-email"
                required
                placeholder="treinador@futnerds.com"
                class="w-full bg-[#161920] border border-white/5 text-white rounded-xl p-4 pl-11 text-sm placeholder:text-gray-700 outline-none transition focus:border-green-500/50"
              />
            </div>
          </div>
    
          <!-- Senha -->
          <div class="flex flex-col gap-2">
            <label for="campo-senha" class="text-[10px] font-bold uppercase tracking-widest text-gray-500 ml-1">
              Digite sua Senha
            </label>
            <div class="relative group">
              <i class="pi pi-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-600 text-sm transition-colors group-focus-within:text-green-500"></i>
              <input
                type="password"
                id="campo-senha"
                required
                placeholder="••••••••"
                class="w-full bg-[#161920] border border-white/5 text-white rounded-xl p-4 pl-11 text-sm placeholder:text-gray-700 outline-none transition focus:border-green-500/50"
              />
            </div>
          </div>
    
          <!-- Links -->
          <div class="flex flex-col gap-3 mt-1">
            <div class="flex items-center gap-2">
              <span class="text-gray-600 text-xs font-medium">Não tem conta?</span>
              <a href="cadastro.html" class="text-[11px] font-black uppercase tracking-widest text-green-500 hover:text-green-400 transition-colors">
                Crie sua conta
              </a>
            </div>
            <a href="#" class="text-[10px] font-black uppercase tracking-widest text-gray-700 hover:text-green-500 transition-colors">
              Esqueceu seu usuário ou senha?
            </a>
          </div>
    
          <!-- Botão -->
          <div class="flex justify-end mt-2">
            <button
              routerLink="/"
              type="submit"
              class="bg-green-500 hover:bg-green-400 active:scale-[0.98] hover:scale-[1.02] text-black font-black uppercase tracking-widest text-xs px-10 py-4 rounded-xl transition-all"
            >
              Acessar meu Painel →
            </button>
          </div>
    
        </form>
    
        <!-- Footer -->
        <div class="mt-10 pt-6 border-t border-white/5 text-center">
          <p class="text-[9px] font-bold uppercase tracking-[0.3em] text-gray-800">
            FutNerds &copy; 2026 — O Vestiário te espera
          </p>
        </div>
    
      </div>
</div>
