<div class="min-h-screen bg-[#0a0b0f] pt-20 pb-10">
  <div class="max-w-7xl mx-auto px-5">
    <!-- Header -->
    <div class="mb-8">
      <h1 class="text-4xl font-bold text-white mb-2">Times</h1>
      <p class="text-gray-400">Gerenciamento de times e suas informações</p>
    </div>

    <!-- Tabela de Times -->
    <div class="bg-[#13151c] border border-[#1e2130] rounded-lg overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full">
          <!-- Header da Tabela -->
          <thead>
            <tr class="bg-[#161820] border-b border-[#1e2130]">
              <th class="px-6 py-4 text-left text-sm font-semibold text-gray-300">Logo</th>
              <th class="px-6 py-4 text-left text-sm font-semibold text-gray-300">Nome</th>
              <th class="px-6 py-4 text-left text-sm font-semibold text-gray-300">País</th>
              <th class="px-6 py-4 text-left text-sm font-semibold text-gray-300">Liga</th>
              <th class="px-6 py-4 text-left text-sm font-semibold text-gray-300">Orçamento</th>
              <th class="px-6 py-4 text-left text-sm font-semibold text-gray-300">Ações</th>
            </tr>
          </thead>

          <!-- Corpo da Tabela -->
          <tbody>
            <tr *ngFor="let time of times" class="border-b border-[#1e2130] hover:bg-[#161820] transition">
              <!-- Logo -->
              <td class="px-6 py-4">
                <img 
                  [src]="time.logo" 
                  [alt]="time.nome"
                  (error)="$event.target.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect fill=%22%231e2130%22 width=%22100%22 height=%22100%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 font-size=%2220%22 fill=%22%236b7280%22 text-anchor=%22middle%22 dy=%22.3em%22%3E?%3C/text%3E%3C/svg%3E'"
                  class="w-10 h-10 rounded object-cover"
                />
              </td>

              <!-- Nome -->
              <td class="px-6 py-4">
                <span class="text-white font-medium">{{ time.nome }}</span>
              </td>

              <!-- País -->
              <td class="px-6 py-4">
                <span class="text-gray-300">{{ time.pais }}</span>
              </td>

              <!-- Liga -->
              <td class="px-6 py-4">
                <span class="px-3 py-1 bg-blue-500/20 text-blue-400 rounded-full text-sm font-medium">
                  {{ time.liga }}
                </span>
              </td>

              <!-- Orçamento -->
              <td class="px-6 py-4">
                <span class="text-gray-300">{{ formatarMoeda(time.orcamento) }}</span>
              </td>

              <!-- Ações -->
              <td class="px-6 py-4">
                <button (click)="selecionarTime(time)" class="px-3 py-1 bg-green-500 text-black rounded hover:bg-green-600 transition text-sm font-medium">
                  Selecionar
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Informação se vazio -->
    <div *ngIf="times.length === 0" class="text-center py-12">
      <p class="text-gray-400">Nenhum time encontrado</p>
    </div>
  </div>
</div>
