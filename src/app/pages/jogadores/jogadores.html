<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogadores - FUTNERDS</title>
  <meta name="description" content="Análise de jogadores do FIFA. Estatísticas, overalls e comparações." />
  <meta name="theme-color" content="#22c55e" />
  <link rel="icon" href="https://d2xsxph8kpxj0f.cloudfront.net/310519663216916845/hhB4oykfDQM9yCvhQGaX3n/logo-futnerds_8f14a724.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <div class="nav-inner">
        <a href="index.html" class="nav-logo">
          <img src="https://d2xsxph8kpxj0f.cloudfront.net/310519663216916845/hhB4oykfDQM9yCvhQGaX3n/logo-futnerds_8f14a724.png" alt="FUTNERDS" class="nav-logo-img" />
          <span class="nav-logo-text">FUT<span class="text-primary">NERDS</span></span>
        </a>

        <div class="nav-links" id="navLinks">
          <a href="index.html" class="nav-link">Início</a>
          <a href="jogadores.html" class="nav-link active">Jogadores</a>
          <a href="#" class="nav-link">Times</a>
          <a href="#" class="nav-link">Sorteio</a>
          <a href="#" class="nav-link">Monte Elenco</a>
        </div>

        <div class="nav-auth" id="navAuth">
          <a href="#" class="btn btn-ghost btn-sm">Entrar</a>
          <a href="#" class="btn btn-primary btn-sm">Cadastrar</a>
        </div>

        <button class="nav-hamburger" id="navHamburger" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>

      <div class="nav-mobile" id="navMobile">
        <a href="index.html" class="nav-mobile-link">Início</a>
        <a href="jogadores.html" class="nav-mobile-link active">Jogadores</a>
        <a href="#" class="nav-mobile-link">Times</a>
        <a href="#" class="nav-mobile-link">Sorteio</a>
        <a href="#" class="nav-mobile-link">Monte Elenco</a>
        <div class="nav-mobile-auth">
          <a href="#" class="btn btn-ghost btn-sm flex-1">Entrar</a>
          <a href="#" class="btn btn-primary btn-sm flex-1">Cadastrar</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- PAGE HEADER -->
  <div class="page-header">
    <div class="container">
      <div class="page-header-inner">
        <div>
          <div class="page-header-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </div>
          <h1 class="page-title">Análise de Jogadores</h1>
          <p class="page-subtitle">Explore o banco de dados completo do modo carreira</p>
        </div>
        <div class="page-header-badge" id="playerCountBadge">
          <span id="playerCountNum">657</span> jogadores
        </div>
      </div>
    </div>
  </div>

  <!-- FILTERS BAR -->
  <div class="filters-bar">
    <div class="container">
      <div class="filters-inner">
        <!-- Search -->
        <div class="search-wrap">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="searchInput" class="search-input" placeholder="Buscar jogador, clube..." />
          <button class="search-clear" id="searchClear" style="display:none">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <!-- Position Filter Pills -->
        <div class="position-pills" id="positionPills">
          <button class="pill pill-active" data-pos="">Todas</button>
          <button class="pill" data-pos="GK">Goleiro</button>
          <button class="pill" data-pos="CB">Zagueiros</button>
          <button class="pill" data-pos="LB">Laterais</button>
          <button class="pill" data-pos="CM">Meio-Campo</button>
          <button class="pill" data-pos="LW">Pontas</button>
          <button class="pill" data-pos="ST">Atacantes</button>
        </div>

        <div class="sort-wrap">
          <select id="sortSelect" class="sort-select">
            <option value="overall-desc">OVR ↓</option>
            <option value="overall-asc">OVR ↑</option>
            <option value="potential-desc">POT ↓</option>
            <option value="age-asc">Idade ↑</option>
            <option value="price-desc">Preço ↓</option>
            <option value="name-asc">Nome A-Z</option>
          </select>
        </div>
      </div>

      <!-- Active Filters -->
      <div class="active-filters" id="activeFilters" style="display:none">
        <span class="active-filter-label">Filtros ativos:</span>
        <div id="activeFilterChips"></div>
        <button class="clear-all-btn" id="clearAllBtn">Limpar tudo</button>
      </div>
    </div>
  </div>

  <!-- PLAYERS GRID -->
  <main class="players-main">
    <div class="container">
      <div class="players-grid" id="playersGrid">
        <!-- Cards gerados via JS -->
      </div>

      <!-- Empty State -->
      <div class="empty-state" id="emptyState" style="display:none">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <p>Nenhum jogador encontrado</p>
        <span>Tente ajustar os filtros</span>
      </div>

      <div class="pagination" id="pagination"></div>
    </div>
  </main>


  <script src="players-data.js"></script>
  <script src="main.js"></script>
  <script src="jogadores.js"></script>
</body>
</html>
